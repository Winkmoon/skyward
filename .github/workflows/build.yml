name: Build PCEM00

# The fork is ported for one legacy device, the OPPO A9x (PCEM00): an
# Android 9 era MT6771 phone with an A-only partition table and no super
# partition. Its recovery partition image is kept in stock/, since the
# phone maker's update packages are not AOSP payload packages.
on:
  push:
    branches: ["pcem00"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  recovery:
    name: Recovery for pcem00
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build the recovery service for the phone
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward
      # The second system's first program runs before any library is there
      # to load, so it is built as a static program.
      - name: Build the second system's first program, static
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward-system-init --target-dir target/system-init
      # LK reserves 32 MiB for the ramdisk at 0x55000000, and anything past
      # that runs into LK's own memory; symbols are most of the two binaries'
      # size on disk.
      - name: Strip the binaries
        run: |
          strip="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          "$strip" target/aarch64-linux-android/release/skyward
          "$strip" target/system-init/aarch64-linux-android/release/system-init
          ls -l target/aarch64-linux-android/release/skyward target/system-init/aarch64-linux-android/release/system-init
      - name: Pack the recovery image
        run: |
          mkdir -p out
          python3 tools/pack_recovery.py \
            --stock stock/pcem00/recovery.img \
            --binary target/aarch64-linux-android/release/skyward \
            --system-init target/system-init/aarch64-linux-android/release/system-init \
            --config devices/pcem00.toml \
            --font stock/pcem00/fonts/DroidSansFallback.ttf \
            --mono stock/pcem00/fonts/DroidSansMono.ttf \
            --mono-license resources/fonts/KirkMono-OFL.txt \
            --out out/skyward-pcem00.img
      - name: Zip the image
        working-directory: out
        run: zip -9 skyward-pcem00.zip skyward-pcem00.img
      - uses: actions/upload-artifact@v7
        with:
          name: skyward-pcem00
          path: out/skyward-pcem00.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
