# Skyward for the OPPO A9x (PCEM00), a MediaTek MT6771 phone built on the
# Android 9 era partition layout: A-only, one recovery partition, no super.
# This configuration is read by the recovery service out of the ramdisk
# (skyward/device.toml).
[device]
codename = "pcem00"
brand = "OPPO"
model = "OPPO A9x"
ab = false
soc = { hans = "联发科 Helio P70", hant = "聯發科 Helio P70", en = "MediaTek Helio P70" }

[display]
width = 1080
height = 2340
density = 480
diagonal = 6.5
corner_radius = 0

# The phone keeps its kernel modules on the vendor partition; there is no
# vendor_boot or vendor_dlkm on this build.
[modules]
sources = ["vendor"]

# The partitions the phone's own programs use where its table mounts them.
# The secure world keeps its registry on persist (the key service reads it
# there), and the WLAN driver's calibration is on nvdata.
[partitions]
mounted = ["persist", "nvdata"]

# The directory for hardware services of the older kind, which the MTK WLAN
# service and supplicant register with; it reads the phone's own VINTF
# manifests from the mounted vendor and odm partitions.
[[service]]
path = "/system/bin/hwservicemanager"
ready_property = "hwservicemanager.ready"

# MediaTek's connectivity chip: wmt_loader loads the WMT firmware and makes
# /dev/wmtWifi. The check keeps it from running again once the node is
# there, which a start of the recovery service after an earlier one leaves.
# wmt_launcher and wlan_assistant then bring up the WLAN driver and its
# calibration from /vendor/firmware and nvdata. Writing 1 to /dev/wmtWifi
# (the WLAN page's first write) powers the chip on and makes wlan0.
[[service]]
path = "/system/bin/sh"
args = ["-c", "[ -e /dev/wmtWifi ] || exec /vendor/bin/wmt_loader"]
oneshot = true

[[service]]
path = "/vendor/bin/wmt_launcher"
args = ["-p", "/vendor/firmware/"]
libraries = ["/vendor/lib64", "/system/lib64"]

[[service]]
path = "/vendor/bin/wlan_assistant"
libraries = ["/vendor/lib64", "/system/lib64"]

[wlan]
# The helpers above load the driver, so the WLAN page only has to power the
# chip on and let the phone's own supplicant join networks.
modules = []
writes = [{ path = "/dev/wmtWifi", value = "1" }]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64/wifilib", "/vendor/lib64", "/vendor/lib64/hw", "/system/lib64", "/system/lib64/hw"]
# The name the recovery's service directory is told of before the WLAN is
# turned on. The phone's supplicant is a hardware service of the older
# kind, which the directory reads from the vendor partition's own manifest,
# so this is the kind of name the newer directory takes and is not waited
# for.
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connectivitycheck.gstatic.com/generate_204"

# The phone's vendor provides keymaster 3.0 over HIDL only, which the
# recovery's own key service does not speak. The engine the phone's own
# third-party recovery shipped unlocks the partition instead: its prep
# script starts the secure world's daemon and the credential and key
# services of the older kind, and the engine installs the keys into the
# filesystem's keyring from the credential, changing nothing on the phone.
[decrypt]
engine = "/system/bin/twrp_fbedec2"

# The recovery keeps no settings between starts on this phone (its metadata
# partition is blank), so the pages start in the language named here rather
# than the one the installed system names.
[ui]
language = "zh-Hans"
